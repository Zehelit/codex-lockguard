name: Windows kaynak kontrolleri

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Sözdizimi ve kimlik senaryoları
        shell: powershell
        run: .\tests\Test-GuardLogic.ps1
      - name: Uyarı yardımcısını derle
        shell: powershell
        run: .\Build-IdentityAlert.ps1
